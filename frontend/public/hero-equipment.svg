<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Ilustrasi armada alat berat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="180" fill="#ffffff" opacity="0.5"/>

  <!-- ground line -->
  <line x1="80" y1="760" x2="1120" y2="760" stroke="#cbd5e1" stroke-width="3"/>

  <!-- excavator body -->
  <rect x="430" y="470" width="360" height="120" rx="18" fill="#0c3d6e"/>
  <rect x="470" y="440" width="240" height="60" rx="12" fill="#0e87e9"/>
  <!-- cab -->
  <rect x="700" y="430" width="120" height="78" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="712" y="442" width="96" height="44" rx="8" fill="#bae0fd"/>

  <!-- boom -->
  <path d="M 420 500 L 210 350 L 150 390" fill="none" stroke="#026bc7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arm -->
  <path d="M 210 350 L 120 560" fill="none" stroke="#0c3d6e" stroke-width="20" stroke-linecap="round"/>

  <!-- bucket -->
  <path d="M 150 560 C 90 620 60 630 90 690 L 170 690 C 150 610 190 590 150 560 Z" fill="#f59e0b"/>

  <!-- tracks -->
  <rect x="400" y="590" width="420" height="80" rx="34" fill="#1e293b"/>
  <rect x="415" y="608" width="390" height="34" rx="17" fill="#334155"/>
  <circle cx="460" cy="648" r="26" fill="#0f172a"/>
  <circle cx="560" cy="648" r="26" fill="#0f172a"/>
  <circle cx="660" cy="648" r="26" fill="#0f172a"/>
  <circle cx="752" cy="648" r="26" fill="#0f172a"/>

  <!-- small support line -->
  <path d="M 760 560 L 810 560" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
</svg>